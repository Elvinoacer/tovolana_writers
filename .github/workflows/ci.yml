name: Tovolana Writers CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tovolana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tovolana_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/tovolana_ci?schema=public
      DIRECT_URL: postgresql://postgres@localhost:5432/tovolana_ci?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INTASEND_IS_TEST: "true"
      ALLOW_MOCK_PAYMENTS: "true"
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run PostgreSQL Migrations
        run: npx prisma migrate deploy

      - name: Seed Initial Marketplace Catalog & Accounts
        run: npm run db:seed

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Run Backend & Integration Tests
        env:
          AUTH_SECRET: ${{ vars.CI_AUTH_SECRET || 'tovolana-ci-ephemeral-session-signing-key' }}
          INTASEND_WEBHOOK_CHALLENGE: ${{ vars.CI_WEBHOOK_CHALLENGE || 'tovolana-ci-challenge' }}
          STORAGE_SIGNING_SECRET: ${{ vars.CI_STORAGE_SECRET || 'tovolana-ci-storage-signing' }}
          CRON_SECRET: ${{ vars.CI_CRON_SECRET || 'tovolana-ci-cron' }}
        run: npm test

      - name: Production Next.js Build
        env:
          AUTH_SECRET: ${{ vars.CI_AUTH_SECRET || 'tovolana-ci-ephemeral-session-signing-key' }}
          INTASEND_WEBHOOK_CHALLENGE: ${{ vars.CI_WEBHOOK_CHALLENGE || 'tovolana-ci-challenge' }}
          STORAGE_SIGNING_SECRET: ${{ vars.CI_STORAGE_SECRET || 'tovolana-ci-storage-signing' }}
          CRON_SECRET: ${{ vars.CI_CRON_SECRET || 'tovolana-ci-cron' }}
        run: npm run build
