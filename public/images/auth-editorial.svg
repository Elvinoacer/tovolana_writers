<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none">
  <defs>
    <linearGradient id="authBg" x1="0" y1="0" x2="560" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="softDrop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="560" height="440" rx="28" fill="url(#authBg)"/>
  <circle cx="470" cy="70" r="110" fill="#3B82F6" fill-opacity="0.14"/>
  <circle cx="80" cy="380" r="120" fill="#0F766E" fill-opacity="0.22"/>

  <!-- Single Unified Passport Card -->
  <g filter="url(#softDrop)">
    <rect x="70" y="64" width="420" height="220" rx="20" fill="#FAF7F2" stroke="#E6E0D4" stroke-width="1.5"/>
  </g>
  <rect x="96" y="88" width="96" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="144" y="103.5" font-family="monospace" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="middle">ONE ACCOUNT</text>

  <circle cx="436" cy="116" r="24" fill="#1E3A8A"/>
  <path d="M428 124 L444 108 M439 107 L445 113" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="96" y="130" width="220" height="12" rx="6" fill="#111827"/>
  <rect x="96" y="152" width="160" height="7" rx="3.5" fill="#6B7280" opacity="0.55"/>

  <!-- 3 Role Chips Inside Passport -->
  <rect x="96" y="184" width="112" height="74" rx="14" fill="#FFFFFF" stroke="#E6E0D4"/>
  <circle cx="118" cy="208" r="10" fill="#EFF6FF"/>
  <circle cx="118" cy="208" r="4" fill="#1E3A8A"/>
  <text x="110" y="236" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#111827">Customer</text>
  <text x="110" y="249" font-family="sans-serif" font-size="9" fill="#6B7280">Free Booking</text>

  <rect x="224" y="184" width="112" height="74" rx="14" fill="#F0FDFA" stroke="#99F6E4"/>
  <circle cx="246" cy="208" r="10" fill="#CCFBF1"/>
  <circle cx="246" cy="208" r="4" fill="#0F766E"/>
  <text x="238" y="236" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0F766E">Creator Hub</text>
  <text x="238" y="249" font-family="sans-serif" font-size="9" fill="#115E59">Merit Assessment</text>

  <rect x="352" y="184" width="112" height="74" rx="14" fill="#FEF3C7" stroke="#FDE68A"/>
  <circle cx="374" cy="208" r="10" fill="#FDE68A"/>
  <circle cx="374" cy="208" r="4" fill="#B45309"/>
  <text x="366" y="236" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#B45309">Pro Tier</text>
  <text x="366" y="249" font-family="sans-serif" font-size="9" fill="#92400E">50% Fee Off</text>

  <!-- Security Pillars Bottom Strip -->
  <g filter="url(#softDrop)">
    <rect x="70" y="308" width="200" height="74" rx="16" fill="#1E293B" stroke="#334155"/>
    <circle cx="100" cy="345" r="14" fill="#0F766E"/>
    <path d="M95 345 L99 349 L106 340" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="340" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">Google &amp; Email</text>
    <text x="124" y="356" font-family="sans-serif" font-size="9.5" fill="#94A3B8">Instant OAuth 2.0 + Salt</text>
  </g>

  <g filter="url(#softDrop)">
    <rect x="290" y="308" width="200" height="74" rx="16" fill="#1E293B" stroke="#334155"/>
    <circle cx="320" cy="345" r="14" fill="#B45309"/>
    <path d="M315 345 H325 M320 340 V350" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="344" y="340" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">M-Pesa OTP Ready</text>
    <text x="344" y="356" font-family="sans-serif" font-size="9.5" fill="#94A3B8">SMS + Escrow Verification</text>
  </g>
